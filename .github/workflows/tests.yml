name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` promises, and what the box runs.
        # 3.11 is the floor because `datetime.UTC` does not exist before it.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q
