[project]
name = "datum"
version = "0.1.0"
description = "Telemetry service over VictoriaMetrics, with a SQL to PromQL translator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]

# The service is not part of the published library; its deps stay in a group.
[dependency-groups]
api = [
    "fastapi>=0.115",
    # [crypto] pulls cryptography, which PyJWT needs for the RSA and ECDSA
    # algorithms. vmauth verifies with those only, so HMAC is never accepted.
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyarrow>=15",
    {include-group = "api"},
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datum", "datum_client", "datum_sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
