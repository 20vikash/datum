[project]
name = "datum"
version = "0.1.0"
description = "Telemetry service over ClickHouse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
api = [
    "clickhouse-connect>=0.8",
    "fastapi>=0.115",
    # [crypto] pulls cryptography, which PyJWT needs for the RSA and ECDSA
    # algorithms. HMAC is never accepted.
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    {include-group = "api"},
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datum"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
