[project]
name = "datum-sql"
version = "0.1.0"
description = "Query a Prometheus-compatible metrics store with SQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datum_sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
