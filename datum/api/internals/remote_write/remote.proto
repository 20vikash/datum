// Remote write 1.0, trimmed to what Datum stores. Field numbers match
// prometheus/prompb. See the README for how to regenerate remote_pb2.py.

syntax = "proto3";

package prometheus;

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  double value = 1;
  int64 timestamp = 2;
}

message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}

message WriteRequest {
  repeated TimeSeries timeseries = 1;
}
