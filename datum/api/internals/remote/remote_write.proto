// Prometheus remote write v1, cut down to what datum reads.
// Field numbers match prometheus/prompb/{types,remote}.proto and cannot change.
syntax = "proto3";

package prometheus;

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  double value = 1;
  int64 timestamp = 2;
}

message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}

message WriteRequest {
  repeated TimeSeries timeseries = 1;
}
